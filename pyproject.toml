[project]
name = "kemm30"
version = "0.1.0"
description = "A tested and functional Python environment for KEMM30 course"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "brewer2mpl>=1.4.1",
    "cryptography==50.0.1",
    "ffmpeg>=1.4",
    "ipykernel>=6.30.1",
    "ipywidgets>=8.1.7",
    "lmfit>=1.3.4",
    "lxml>=6.0.1",
    "matplotlib>=3.10.6",
    "mdtraj>=1.11.0",
    "nglview>=3.1.4",
    "nmrglue",
    "notebook>=7.4.5",
    "numpy>=2.3.3",
    "pandas>=2.3.2",
    "py3dmol>=2.5.2",
    "rdkit>=2025.3.6",
    "scipy>=1.16.1",
    "uncertainties==3.2.3",
]

[tool.uv.sources]
nmrglue = { git = "https://github.com/jjhelmus/nmrglue" }
